{% extends 'base.html' %}{% block title %}New Invoice — Veloxa Warehouse{% endblock %}{% block page_title %}New Invoice{% endblock %}{% block active %}invoices{% endblock %}
{% block content %}
<div class="card form-card">
  <form method="post">{% csrf_token %}
    <div class="form-group"><label class="form-label">Order Reference</label><input class="form-control" name="order_ref" required placeholder="PO-2025-001"></div>
    <div class="form-group"><label class="form-label">Customer</label><select class="form-control" name="customer_id"><option value="">— No customer —</option>{% for c in customers %}<option value="{{ c.id }}">{{ c.name }}</option>{% endfor %}</select></div>
    <hr>
    <h3>Line Items</h3>
    <div id="lines">
      <div class="line-row" style="display:flex;gap:8px;margin-bottom:8px">
        <select name="product_id[]" class="form-control" style="flex:2" required><option value="">— Select product —</option>{% for p in products %}<option value="{{ p.id }}">{{ p.sku }} — {{ p.name }}</option>{% endfor %}</select>
        <input name="qty[]" class="form-control" style="flex:1" type="number" min="1" placeholder="Qty" required>
        <input name="unit_price[]" class="form-control" style="flex:1" type="number" step="0.01" min="0" placeholder="Price" required>
        <button type="button" class="btn btn-sm btn-danger" onclick="this.parentElement.remove()">X</button>
      </div>
    </div>
    <button type="button" class="btn btn-outline" onclick="addLine()">+ Add Line</button>
    <hr>
    <div class="form-actions"><button type="submit" class="btn btn-primary">Create Invoice</button><a href="{% url 'invoice-list' %}" class="btn">Cancel</a></div>
  </form>
</div>
{% endblock %}
{% block extra_js %}
<script>
function addLine() {
  const row = document.querySelector('.line-row').cloneNode(true);
  row.querySelectorAll('input,select').forEach(el => el.value = '');
  document.getElementById('lines').appendChild(row);
}
</script>
{% endblock %}
