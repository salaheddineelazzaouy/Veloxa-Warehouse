{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — Veloxa Warehouse</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-primary: #0e0f13;
      --bg-card: #1a1c23;
      --border: #2a2d36;
      --text-primary: #e8e8ed;
      --text-secondary: #8b8d97;
      --text-muted: #5c5e68;
      --accent: #7a5fff;
      --accent-hover: #6b50e8;
      --success: #2ed573;
      --danger: #ff4757;
      --radius: 12px;
      --radius-sm: 8px;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: "Inter", -apple-system, sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    .login-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 40px;
      width: 380px;
      max-width: 90vw;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 32px;
    }
    .brand-icon {
      width: 42px; height: 42px;
      background: var(--accent);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700; font-size: 20px; color: #fff;
    }
    .brand-text {
      font-size: 22px; font-weight: 600; letter-spacing: -.3px;
    }
    h1 {
      font-size: 18px; font-weight: 600; margin-bottom: 4px;
    }
    .subtitle {
      font-size: 13px; color: var(--text-muted); margin-bottom: 24px;
    }
    .form-group {
      margin-bottom: 16px;
    }
    label {
      display: block;
      font-size: 12px;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: .5px;
      color: var(--text-secondary);
      margin-bottom: 6px;
    }
    input[type="text"], input[type="password"] {
      width: 100%;
      padding: 10px 14px;
      background: var(--bg-primary);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      color: var(--text-primary);
      font-size: 14px;
      font-family: inherit;
      outline: none;
      transition: border-color .15s;
    }
    input:focus {
      border-color: var(--accent);
    }
    .btn {
      width: 100%;
      padding: 11px;
      background: var(--accent);
      border: none;
      border-radius: var(--radius-sm);
      color: #fff;
      font-size: 14px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      transition: background .15s;
      margin-top: 8px;
    }
    .btn:hover { background: var(--accent-hover); }
    .error {
      background: rgba(255,71,87,.12);
      color: var(--danger);
      padding: 10px 14px;
      border-radius: var(--radius-sm);
      font-size: 13px;
      margin-bottom: 16px;
    }
  </style>
</head>
<body>
  <div class="login-card">
    <div class="brand">
      <div class="brand-icon">V</div>
      <span class="brand-text">Veloxa</span>
    </div>
    <h1>Welcome back</h1>
    <p class="subtitle">Sign in to Warehouse Dashboard</p>
    {% if error %}<div class="error">{{ error }}</div>{% endif %}
    <form method="post">
      {% csrf_token %}
      <div class="form-group">
        <label>Username</label>
        <input type="text" name="username" required autocomplete="username" autofocus>
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" name="password" required autocomplete="current-password">
      </div>
      <button type="submit" class="btn">Sign In</button>
    </form>
    <p style="margin-top:20px;font-size:12px;color:var(--text-muted);text-align:center;">
      Demo: manager / pass1234
    </p>
    <p style="margin-top:12px;font-size:13px;color:var(--text-muted);text-align:center;">
      Don't have an account? <a href="/signup/" style="color:var(--accent);text-decoration:none;font-weight:600">Sign up</a>
    </p>
  </div>
</body>
</html>
