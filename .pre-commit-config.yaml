repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.4.0
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.10.0
    hooks:
      - id: mypy
        additional_dependencies: [django-stubs]
  - repo: https://github.com/PyCQA/bandit
    rev: 1.7.8
    hooks:
      - id: bandit
        args: [-ll, -x, tests]
  - repo: local
    hooks:
      - id: no-raw-sql
        name: Check for raw SQL
        entry: python -c "import sys; sys.exit(1 if any('raw(' in l or 'RawSQL' in l or 'cursor.execute' in l for l in open(sys.argv[1]).readlines()) else 0)"
        language: system
        files: \.py$
